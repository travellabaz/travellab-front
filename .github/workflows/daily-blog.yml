name: Daily blog post

on:
  schedule:
    # 07:13 UTC every day — picked off the :00/:30 mark on purpose. The job
    # itself decides by the weekday (see scripts/blog-job.mjs): Mon/Wed/Fri a
    # new draft, Tue/Thu a refresh draft, weekend nothing. Drafts are published
    # from the CRM ("Bloq qaralamaları").
    - cron: '13 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'new or refresh (empty: by the weekday)'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write today's draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # optional: without it the refresh days are skipped
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BLOG_MODE: ${{ inputs.mode }}
        run: node scripts/blog-job.mjs

      - name: Commit and push
        run: |
          git config user.name "travellab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/blog/drafts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add blog draft"
            # main can move between checkout and here (this job runs the
            # slow Gemini/Pexels calls first) — rebase onto whatever's
            # current before pushing instead of failing outright on a
            # stale ref, like it did when an unrelated push landed mid-run.
            git pull --rebase origin main
            git push
          fi
