name: Daily blog post

on:
  schedule:
    # 07:13 UTC every day — picked off the :00/:30 mark on purpose, see
    # scripts/generate-blog-post.mjs for what actually gets written.
    - cron: '13 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push
        run: |
          git config user.name "travellab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/blog/posts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add daily blog post"
            git push
          fi
