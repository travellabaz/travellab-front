name: Daily blog post

on:
  schedule:
    # TEMPORARY test slot — revert to '13 7 * * *' after confirming the run.
    - cron: '34 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push
        run: |
          git config user.name "travellab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/blog/posts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add daily blog post"
            git push
          fi
