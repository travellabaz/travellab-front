name: Daily tour-sync rebuild

# site-backend's TourSyncJob runs at 3:00 UTC and updates which tours are
# active/inactive. This site is static (Netlify builds on git push), so
# without this, a tour going inactive wouldn't be reflected here — 301
# redirect, sitemap removal, noindex — until the next unrelated push
# happened to rebuild it (previously only the 07:13 UTC daily-blog commit).
# An empty commit shortly after 3:00 is enough to trigger a fresh Netlify
# build/deploy, same mechanism daily-blog.yml already relies on.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-tour-sync-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Travellab Shop's "admin panel" is a Google Sheet (see
      # src/data/shop/index.js) — this pulls it as CSV, downloads each
      # product's photos out of Drive into public/images/shop/products, and
      # regenerates src/data/shop/products.json. A no-op commit below still
      # covers the tour-sync rebuild even on a day nothing here changed.
      - name: Sync Shop products from the Google Sheet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/sync-shop-products.mjs

      - name: Commit Shop product changes, if any
        run: |
          git config user.name "travellab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/shop/products.json src/data/shop/slugRedirects.json public/images/shop/products
          if git diff --cached --quiet; then
            echo "No Shop product changes"
          else
            git commit -m "Sync Shop products from Google Sheet"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger a Netlify rebuild
        run: |
          git config user.name "travellab-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild after daily tour status sync"
          git pull --rebase origin main
          git push
